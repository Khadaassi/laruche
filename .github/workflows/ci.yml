name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  front:
    name: Front (Tailwind build + tokens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:tokens
      - run: npm run build

  test:
    name: Tests + deploy checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: laruche
          POSTGRES_PASSWORD: laruche
          POSTGRES_DB: laruche
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U laruche"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valeurs jetables propres à la CI, sans rapport avec la production.
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ci.laruche.invalid
      DATABASE_URL: postgresql://laruche:laruche@localhost:5432/laruche
      DATABASE_SSL_REQUIRE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - name: Generate throwaway SECRET_KEY
        run: echo "DJANGO_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run python manage.py test
      - name: Deploy checks
        run: uv run python manage.py check --deploy --fail-level WARNING

  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
