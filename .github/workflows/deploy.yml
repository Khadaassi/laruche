name: Deploy

# À chaque merge sur main : construit l'image, l'envoie dans Artifact Registry,
# applique les migrations (job Cloud Run), puis déploie le service Cloud Run.
#
# Inactif tant que la variable de dépôt GCP_PROJECT_ID n'est pas définie
# (voir scripts/gcp-setup.sh). Aucune clé de compte de service : GitHub
# s'authentifie auprès de Google par Workload Identity Federation (OIDC).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloud Run
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
      ALLOWED_HOSTS: ${{ vars.DJANGO_ALLOWED_HOSTS }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/laruche/app:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Docker login (Artifact Registry)
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          # Une seule image par version : le quota gratuit d'Artifact Registry est de 0,5 Go.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Variables non secrètes, communes au job de migration et au service.
      # Fichier YAML : DJANGO_ALLOWED_HOSTS peut contenir des virgules.
      - name: Runtime env file
        run: |
          cat > env.yaml <<EOF
          DJANGO_ALLOWED_HOSTS: "$ALLOWED_HOSTS"
          DJANGO_BEHIND_PROXY: "true"
          EOF

      - name: Migrations
        run: |
          gcloud run jobs deploy laruche-migrate \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --command python \
            --args manage.py,migrate,--noinput \
            --env-vars-file env.yaml \
            --set-secrets DJANGO_SECRET_KEY=django-secret-key:latest,DATABASE_URL=database-url:latest \
            --max-retries 0 \
            --task-timeout 5m \
            --execute-now \
            --wait

      - name: Deploy service
        run: |
          gcloud run deploy laruche \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --env-vars-file env.yaml \
            --set-secrets DJANGO_SECRET_KEY=django-secret-key:latest,DATABASE_URL=database-url:latest \
            --allow-unauthenticated \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 1 \
            --cpu-boost

      - name: Smoke test
        run: |
          # Premier hôte autorisé = URL publique du service : vérifie aussi ALLOWED_HOSTS.
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "https://${ALLOWED_HOSTS%%,*}/healthz/"
