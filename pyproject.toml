[project]
name = "laruche"
version = "0.1.0"
description = "La Ruche — organisation familiale"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=2.3",
    "django>=5.2,<5.3",
    "django-csp>=4.0",
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests*.py" = ["S101", "S105", "S106"]
