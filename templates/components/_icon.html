{# Icône au trait (currentColor). Paramètres : name, icon_size. Décorative : le texte l'accompagne toujours. #}

  {% elif name == "chore" %}<path d="M14 3 8 13"/><path d="M5 13h8l2 8H3z"/><path d="M7 17v4M11 17v4"/>

  {% elif name == "lunch_elsewhere" %}<path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/>

  {% elif name == "tomorrow" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {% else %}<circle cx="12" cy="12" r="3"/>{% endif %}
</svg>
