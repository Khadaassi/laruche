{# Choix de personnes en puces avec avatar (plusieurs possibles). Paramètre : field. #}
<fieldset>
  <legend class="mb-1 font-medium">{{ field.label }}</legend>
  <div class="flex flex-wrap gap-space-2">
    {% for box in field %}
      <label class="flex min-h-11 cursor-pointer items-center gap-space-2 rounded-sm border border-border-strong py-1 pl-1 pr-space-4 has-[:checked]:border-ink has-[:checked]:bg-ink has-[:checked]:text-surface-0 has-[:focus-visible]:outline has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-honey-dark">
        {{ box.tag }}{% include "components/_avatar.html" with person=box.data.value.instance %}<span>{{ box.choice_label }}</span>
      </label>
    {% endfor %}
  </div>
  {% if field.help_text %}<p class="mt-1 text-sm text-ink-soft">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="text-sm font-medium text-terracotta" role="alert">{{ error }}</p>{% endfor %}
</fieldset>
